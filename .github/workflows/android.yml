
name: Build Kazi Travels APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Kazi_Travels_Android_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          unzip -o Kazi_Travels_Android_Project.zip -d extracted

      - name: Build APK
        working-directory: extracted/KaziTravelsAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kazi-Travels-APK
          path: extracted/KaziTravelsAndroid/app/build/outputs/apk/debug/app-debug.apk
